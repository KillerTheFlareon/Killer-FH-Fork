- type: entity
  id: CrateSecuritySecway
  parent: CrateSecgear
  name: Secway Crate
  description: A standard-issue secway for apprehending criminals, or a poor substitute for exercise. Probably both.
  components:
  - type: StorageFill
    contents:
      - id: VehicleSecwayFilled

- type: entity
  id: CrateSecuritySecwayTurbo
  parent: CrateSecgear
  name: Secway Turbo Crate
  description: A premium-grade secway for catching and shooting criminals at the same time.
  components:
  - type: StorageFill
    contents:
      - id: VehicleSecwayTurboFilled

- type: entity
  id: CrateSecuritySTV
  parent: CrateSecgear
  name: STV Crate
  description: A security-grade ATV for catching criminals and running over Tiders.
  components:
  - type: StorageFill
    contents:
      - id: VehicleATVNTSecFilled

- type: entity
  parent: CrateSecgear
  id: CrateSecurityTrackingMindshieldImplantsNS
  name: Implanter Crate
  suffix: NS, Secure
  description: Contains 4 NeoSol MindShield implants and 4 tracking implant. Requires Security access to open.
  components:
  - type: EntityTableContainerFill
    containers:
      entity_storage: !type:AllSelector
        children:
        - id: MindShieldImplanterNS
          amount: 4
        - id: TrackingImplanter
          amount: 4
  - type: AccessReader
    access: [["SecurityNS"], ["CadetNS"]]