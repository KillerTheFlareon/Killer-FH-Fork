- type: entity
  parent: BaseSubdermalImplant
  id: FakeMindShieldImplantNS
  name: Fake Mindshield Implant (NS)
  description: This implant allows the implanter to produce a fake signal that security huds use to identify individuals implanted with a mindshield. # FH
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    implantAction: FakeMindShieldToggleAction
    implantComponents:
    - type: FakeMindShield # TODO: put the component on the implant and use implant relay events for the status icon
      mindShieldStatusIcon: MindShieldIconNS
  - type: FakeMindShieldImplant