- type: entity
  parent: BriefcaseBaseSecure
  id: BriefcaseSecureNuke
  name: Nuclear Authentication Codes Case
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Storage/Briefcases/briefcase_secure.rsi
    layers: 
      - state: icon
      - state: open
        shader: unshaded
      - state: closed
        shader: unshaded
        map: ["enum.LockVisualLayers.Lock"]
      - state: spark
        shader: unshaded
        visible: false
        map: ["spark"]
  - type: LockVisuals
    stateLocked: closed
    stateUnlocked: open
  - type: Item
    sprite: _Starlight/Objects/Storage/Briefcases/briefcase_secure.rsi
