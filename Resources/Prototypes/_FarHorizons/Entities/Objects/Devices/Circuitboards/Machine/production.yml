#region NT
- type: entity
  id: SMESShipMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: Ship SMES Circuit Board
  description: A machine printed circuit board for an ship-grade SMES.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: power_mod
  - type: MachineBoard
    prototype: SMESShipEmpty
    stackRequirements:
      Manipulator: 4
      CableHV: 40
    componentRequirements:
      PowerCell:
        amount: 4
        defaultPrototype: PowerCellHigh

