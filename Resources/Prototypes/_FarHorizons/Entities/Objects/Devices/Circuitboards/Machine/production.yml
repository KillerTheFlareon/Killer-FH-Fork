- type: entity
  id: SubstationShipMachineCircuitboard
  parent: BaseMachineCircuitboard
  name: Ship Substation Machine Board
  description: A machine printed circuit board for a substation.
  components:
    - type: MachineBoard
      prototype: SubstationShipEmpty
      stackRequirements:
        Manipulator: 3
        CableMV: 15
        CableHV: 15
      componentRequirements:
        PowerCell:
          amount: 1
          defaultPrototype: PowerCellHigh
    - type: PhysicalComposition
      materialComposition:
        Glass: 200
      chemicalComposition:
        Silicon: 20
    - type: StaticPrice
      price: 58

