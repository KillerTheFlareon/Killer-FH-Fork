- type: entity
  name: Crisis Button
  parent: BaseItem
  id: CrisisButton_NS
  description: Used to broadcast an distress call to security comms.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Specific/Security/crisisButton.rsi
    state: icon
  - type: Item
    size: Tiny
  - type: UseDelay
    delay: 120.0
  - type: EmitSoundOnUse
    sound:
        collection: TriggerActivate
  - type: TriggerOnUse
  - type: RattleOnTrigger
    radioChannel: SyndiSec
    targetUser: true
    messages:
      Alive: rattle-on-trigger-distress-message
  - type: Tag #FH
    tags: #FH
      - SecBeltEquip #FH