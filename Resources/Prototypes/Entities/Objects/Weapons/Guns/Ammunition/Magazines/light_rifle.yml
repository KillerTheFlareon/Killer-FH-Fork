# Empty mags
- type: entity
  id: BaseMagazineRifle762 #FH
  parent: [ BaseItem, BaseSecurityContraband ]
  abstract: true
  name: "magazine (7.62 rifle)" #FH
  components:
  - type: Tag
    tags:
      - MagazineRifle762 #FH
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeRifle762 #FH
    proto: CartridgeRifle762SP #FH
    capacity: 30
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/LightRifle/light_rifle_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

# Magazines
- type: entity
  id: MagazineRifle762BoxSP #FH
  name: L6 SAW magazine box (7.62 rifle SP) #FH
  parent: BaseMagazineRifle762 #FH
  description: Box containing a 100-round belt of linked 7.62 rifle rounds, used by light machine guns such as the L6. Intended to hold general-purpose kinetic ammunition. #FH
  components:
  - type: Tag
    tags:
      - MagazineRifle762Box #FH
  - type: BallisticAmmoProvider
    proto: CartridgeRifle762SP #FH
    capacity: 100
  - type: Item
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/LightRifle/light_rifle_box.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 8
    zeroVisible: false
  - type: Appearance


