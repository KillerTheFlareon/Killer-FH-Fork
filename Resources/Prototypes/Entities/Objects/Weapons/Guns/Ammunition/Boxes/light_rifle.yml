- type: entity
  abstract: true
  parent: BaseItem
  id: BaseMagazineBoxRifle762 #FH
  name: ammunition box (7.62 rifle) #FH
  description: 120 round box of 7.62 Rifle ammunition. #Far Horizons
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - CartridgeRifle762 #FH
    proto: CartridgeRifle762SP #FH
    capacity: 120 #FH - 4x mag size
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Boxes/light_rifle.rsi
  - type: MagazineVisuals
    magState: mag
    steps: 4
    zeroVisible: false
  - type: Appearance

# Boxes
- type: entity
  parent: BaseMagazineBoxRifle762 #FH
  id: MagazineBoxRifle762Big #FH
  name: ammunition box (7.62 rifle SP) #FH
  description: 200 round box of 7.62 ammunition. #Far Horizons
  components:
  - type: BallisticAmmoProvider
    capacity: 200
    proto: CartridgeRifle762SP #FH
  - type: Sprite
    layers:
    - state: base-b
      map: ["enum.GunVisualLayers.Base"]
    - state: magb-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: magb
    steps: 4
    zeroVisible: false
  - type: Appearance

